# 4G asked for more than this machine (8 GB total) could map, so the JVM died
# with a native out-of-memory during R8. 2G leaves headroom for the Kotlin and
# R8 workers, which run in their own processes.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m
# Keep R8/dexing inside the Gradle daemon instead of forking more JVMs.
android.enableR8.fullMode=false
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=34
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
