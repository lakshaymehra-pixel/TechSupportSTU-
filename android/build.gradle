 buildscript {
    ext.kotlin_version = '2.1.20'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // AGP itself is declared in settings.gradle's plugins block; declaring it
        // here too would conflict with that version.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.13'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.7.1'

    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }

}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
// Compatibility shim for plugins written before AGP 8.
//
// AGP 8 removed the `package` attribute from a library's AndroidManifest and
// requires `namespace` in its build.gradle instead. Plugins that were last
// published before that change (e.g. lean_file_picker 0.0.2, built against
// AGP 4.1) fail to configure with "Namespace not specified".
//
// Rather than pinning the whole project back to AGP 7, read the package out of
// each such plugin's manifest and set it as the namespace. Plugins that already
// declare a namespace are left untouched. Their very old compileSdk is also
// raised to the app's, since AGP 8 will not build against SDK 30 any more.
// Registered on plugin application rather than in afterEvaluate: the
// evaluationDependsOn(':app') above means subprojects are already evaluated by
// the time an afterEvaluate hook would run.
subprojects { subproject ->
    subproject.afterEvaluate {
        def androidExt = subproject.extensions.findByName('android')
        if (androidExt == null) return

        if (androidExt.namespace == null) {
            def manifest = subproject.file('src/main/AndroidManifest.xml')
            if (manifest.exists()) {
                def pkg = new groovy.xml.XmlSlurper(false, false)
                        .parse(manifest)
                        .@package
                        .text()
                if (pkg) {
                    androidExt.namespace = pkg
                }
            }
        }

        // Raise the compile SDK of plugins that still target very old versions.
        // lean_file_picker declares 30, where android:attr/lStar does not exist,
        // so its resource linking fails against current androidx.
        def current = androidExt.compileSdkVersion?.replaceAll(/\D/, '')
        if (!current || current.toInteger() < 35) {
            androidExt.compileSdkVersion 36
            subproject.logger.lifecycle(
                    "Raised compileSdk to 36 for ':${subproject.name}' (was ${current ?: 'unset'})")
        }
    }
}

// Registered after the shim above: evaluationDependsOn forces subprojects to
// evaluate immediately, so any afterEvaluate hook declared later would never fire.
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
// The old `force 'androidx.core:core-ktx:1.7.0'` was removed. Pinning core-ktx
// that far back also drags androidx.core itself back, and resource linking then
// fails with "resource android:attr/lStar not found" because attributes the
// current plugins reference only exist in newer androidx.core. Gradle picks the
// highest requested version on its own, which is what these plugins expect.